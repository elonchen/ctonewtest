version: '3.8'

services:
  openai-api:
    build: .
    container_name: local-openai-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=sk-local-test-key
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
